<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Staff Appraisal System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="Style&Functions/styles.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <i class="bi bi-mortarboard-fill"></i>
            <h2>Staff Appraisal</h2>
            <p>Sign in to your account</p>
        </div>

        <div id="authAlert" class="alert alert-danger hidden">
            <i class="bi bi-exclamation-triangle"></i>
            <span></span>
        </div>

        <form class="auth-form" id="loginForm">
            <div class="form-group">
                <label for="loginEmail">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" id="loginEmail" placeholder="Enter your email" required>
                </div>
            </div>

            <div class="form-group">
                <label for="loginPassword">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="loginPassword" placeholder="Enter your password" required>
                    <span class="input-group-text password-toggle" id="togglePassword">
                        <i class="bi bi-eye"></i>
                    </span>
                </div>
            </div>

            <div class="d-flex justify-content-between align-center mb-3">
                <label class="d-flex align-center gap-2" style="cursor: pointer;">
                    <input type="checkbox" id="rememberMe" style="width: auto;">
                    <span style="font-size: 14px;">Remember me</span>
                </label>
                <a href="LOGINS/forgot-password.html" class="text-decoration-none" style="font-size: 14px; color: var(--primary);">Forgot Password?</a>
            </div>

            <button type="submit" class="auth-btn">
                <i class="bi bi-box-arrow-in-right"></i> Sign In
            </button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account? <a href="LOGINS/signup.html">Sign Up</a></p>
        </div>




    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="Style&Functions/App.js"></script>
    <script src="LOGINS/auth.js"></script>
</body>
</html>
